services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PORT: "3001"
      DATA_DIR: "/data/worlds"
    volumes:
      - worlds_data:/data/worlds
    restart: unless-stopped

volumes:
  worlds_data:
